<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Experimental project mockup</title>
  <desc id="desc">Experimental compiler and parsing interface with a syntax tree and terminal output.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="36" fill="url(#bg)"/>
  <rect x="62" y="76" width="1076" height="522" rx="30" fill="#0f172a" stroke="rgba(255,255,255,0.08)"/>
  <rect x="86" y="100" width="1030" height="82" rx="22" fill="#111827"/>
  <text x="120" y="152" fill="#f8fafc" font-family="Arial, sans-serif" font-size="28" font-weight="700">Compiler Playground</text>
  <rect x="102" y="220" width="420" height="336" rx="26" fill="#111827"/>
  <rect x="598" y="220" width="480" height="336" rx="26" fill="#111827"/>
  <text x="130" y="268" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="18" letter-spacing="2">AST NODES</text>
  <circle cx="276" cy="286" r="42" fill="url(#accent)" opacity="0.9"/>
  <text x="276" y="292" text-anchor="middle" fill="#0b1120" font-family="Arial, sans-serif" font-size="24" font-weight="700">Prog</text>
  <circle cx="174" cy="390" r="34" fill="#1f2937" stroke="rgba(255,255,255,0.08)"/>
  <circle cx="382" cy="390" r="34" fill="#1f2937" stroke="rgba(255,255,255,0.08)"/>
  <line x1="255" y1="318" x2="190" y2="360" stroke="rgba(255,255,255,0.24)" stroke-width="5"/>
  <line x1="297" y1="318" x2="362" y2="360" stroke="rgba(255,255,255,0.24)" stroke-width="5"/>
  <text x="174" y="396" text-anchor="middle" fill="#f8fafc" font-family="Arial, sans-serif" font-size="18" font-weight="700">Decl</text>
  <text x="382" y="396" text-anchor="middle" fill="#f8fafc" font-family="Arial, sans-serif" font-size="18" font-weight="700">Expr</text>
  <text x="626" y="268" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="18" letter-spacing="2">TERMINAL OUTPUT</text>
  <rect x="624" y="304" width="388" height="178" rx="20" fill="#0b1120"/>
  <text x="648" y="344" fill="#f97316" font-family="Courier New, monospace" font-size="18">$ parse source.lang</text>
  <text x="648" y="380" fill="#f8fafc" font-family="Courier New, monospace" font-size="18">tokens: 241</text>
  <text x="648" y="416" fill="#cbd5e1" font-family="Courier New, monospace" font-size="18">tree: balanced</text>
  <text x="648" y="452" fill="#c084fc" font-family="Courier New, monospace" font-size="18">output: optimized AST</text>
  <rect x="624" y="504" width="260" height="26" rx="13" fill="rgba(255,255,255,0.1)"/>
  <text x="754" y="523" text-anchor="middle" fill="#f8fafc" font-family="Arial, sans-serif" font-size="14" letter-spacing="1.6">EXPERIMENTAL / R&amp;D</text>
</svg>
