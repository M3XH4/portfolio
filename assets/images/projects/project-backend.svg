<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Backend project mockup</title>
  <desc id="desc">Backend architecture diagram with services, API gateway, and data stores.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="36" fill="url(#bg)"/>
  <rect x="70" y="80" width="170" height="92" rx="22" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
  <text x="155" y="132" text-anchor="middle" fill="#f8fafc" font-family="Arial, sans-serif" font-size="24" font-weight="700">Client</text>
  <rect x="445" y="188" width="310" height="150" rx="28" fill="#0b1120" stroke="url(#accent)" stroke-width="3"/>
  <text x="600" y="250" text-anchor="middle" fill="#f8fafc" font-family="Arial, sans-serif" font-size="30" font-weight="700">API Gateway</text>
  <text x="600" y="286" text-anchor="middle" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="18">Auth, routing, telemetry, rate limits</text>
  <rect x="890" y="86" width="240" height="108" rx="22" fill="#111827"/>
  <rect x="890" y="226" width="240" height="108" rx="22" fill="#111827"/>
  <rect x="890" y="366" width="240" height="108" rx="22" fill="#111827"/>
  <text x="1010" y="142" text-anchor="middle" fill="#f8fafc" font-family="Arial, sans-serif" font-size="24" font-weight="700">Auth Service</text>
  <text x="1010" y="282" text-anchor="middle" fill="#f8fafc" font-family="Arial, sans-serif" font-size="24" font-weight="700">Payment Service</text>
  <text x="1010" y="422" text-anchor="middle" fill="#f8fafc" font-family="Arial, sans-serif" font-size="24" font-weight="700">Notification</text>
  <rect x="438" y="414" width="324" height="160" rx="28" fill="#111827"/>
  <text x="600" y="468" text-anchor="middle" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="22" letter-spacing="2">DATABASE</text>
  <text x="600" y="507" text-anchor="middle" fill="#f8fafc" font-family="Arial, sans-serif" font-size="34" font-weight="700">PostgreSQL + Redis</text>
  <path d="M240 126 H445" stroke="url(#accent)" stroke-width="6" stroke-linecap="round"/>
  <path d="M755 258 H890" stroke="rgba(255,255,255,0.22)" stroke-width="5" stroke-linecap="round"/>
  <path d="M755 258 H827 V140 H890" stroke="rgba(255,255,255,0.22)" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M755 258 H827 V280 H890" stroke="rgba(255,255,255,0.22)" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M755 258 H827 V420 H890" stroke="rgba(255,255,255,0.22)" stroke-width="5" stroke-linecap="round" fill="none"/>
</svg>